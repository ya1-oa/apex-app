 debts:[{id:'card1',name:'Credit card A',balance:1401,limit:0,apr:0,min:0,due:''},{id:'card2',name:'Credit card B',balance:1000,limit:0,apr:0,min:0,due:''},{id:'acima',name:'Acima bike lease',balance:2000,limit:0,apr:0,min:130.60,due:'2026-10-16',note:'User estimate: early purchase quote around $1,200, valid October 9; confirm current quote before paying.'}],

 entries:[], mit:{selected:0,completed:0,paid:0,bonusRate:0},
 opportunities:[{id:'malik',name:'Malik — six-month SWE contract',type:'Career',stage:'interview',value:0,next:'Confirm Tuesday callback time',due:'2026-10-13'},{id:'tuesday',name:'Tuesday technical interview · 3:15 PM',type:'Career',stage:'interview',value:0,next:'Confirm company, link, prepare examples',due:'2026-10-13'},{id:'joe',name:'Joe — MIT backlog claims',type:'MIT',stage:'active',value:0,next:'Confirm 24/25 eligible claims and second $10 condition',due:''},{id:'caesar',name:'Caesar — handyman jobs',type:'Service',stage:'lead',value:0,next:'Ask for first assigned job and payment terms',due:''},{id:'moving',name:'Moving company outreach',type:'Service',stage:'lead',value:0,next:'Follow up for paid shifts',due:''},{id:'viv',name:'Viv — clothing prototypes',type:'Creative',stage:'lead',value:0,next:'Schedule Fashion District sourcing day',due:''},{id:'upwork',name:'Upwork — selective SWE proposals',type:'Engineering',stage:'lead',value:0,next:'Measure connects and reply rate before weekly spend',due:''}],

});
let F;try{const raw=JSON.parse(localStorage.getItem(key)||'null');F=raw?{...initial(),...raw}:initial()}catch{F=initial()}
const $=s=>document.querySelector(s), num=x=>Number(x)||0, fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(num(n)),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), date=()=>new Date().toISOString().slice(0,10);
const persist=()=>{F.updated=new Date().toISOString();localStorage.setItem(key,JSON.stringify(F)); syncMain();};
function syncMain(){if(typeof S!=='undefined'&&S.money){S.money.cash=F.accounts.reduce((s,a)=>s+num(a.balance),0);S.money.cards=F.debts.filter(d=>d.id!=='acima').reduce((s,d)=>s+num(d.balance),0);S.money.rentGoal=F.rent.goal;S.money.rentSaved=F.rent.reserved;save();}}
const paid=(k)=>F.entries.filter(e=>e.kind===k).reduce((a,e)=>a+num(e.amount),0);
function totals(){const actualIncome=paid('income'),expenses=paid('expense'), liquid=F.accounts.reduce((a,e)=>a+num(e.balance),0),cards=F.debts.filter(d=>d.id!=='acima').reduce((a,e)=>a+num(e.balance),0), weekly=F.lanes.filter(e=>e.unit==='weekly').reduce((a,e)=>a+num(e.forecast),0);return {actualIncome,expenses,liquid,cards,weekly,unprotected:Math.max(0,liquid-F.rent.reserved)}}
const block=(title,sub,inner)=>`<section class="f-panel"><header class="f-head"><div><div class="eye">${safe(sub)}</div><h3>${safe(title)}</h3></div></header>${inner}</section>`;
const digits=(value,label,hint='')=>`<div class="f-stat"><div>${fmt(value)}</div><small>${label}</small>${hint?`<em>${safe(hint)}</em>`:''}</div>`;
function overview(){let t=totals(),gap=Math.max(0,F.rent.goal-F.rent.reserved),months=F.rent.monthsTarget;return `<div class="f-intro"><div><div class="eye" style="color:var(--g)">PHASE 03 · CAPITAL / EARNINGS / PIPELINE</div><h2>Cash is a constraint.<br><em>Execution is leverage.</em></h2><p>Live balances are not connected. Enter transactions and balances deliberately; projections are never counted as cash received.</p></div><button class="btn primary" id="fNewEntry">+ Record transaction</button></div><div class="f-stats">${digits(t.liquid,'ACCOUNT BALANCES · MANUAL')}${digits(F.rent.reserved,'RESERVED FOR RENT')}${digits(gap,'NEXT RENT GAP')}${digits(t.cards,'CREDIT CARDS')}</div>${block('Capital allocation','Protect the floor',`<div class="f-rent"><div><div class="eye">RENT RESERVE</div><strong>${fmt(F.rent.reserved)} <span>/ ${fmt(F.rent.goal*months)} for ${months} months</span></strong><div class="bar"><i style="width:${Math.min(100,100*F.rent.reserved/(F.rent.goal*months||1))}%"></i></div></div><div class="f-actions"><button class="btn" data-f="reserve">Move into rent reserve</button><button class="btn" data-f="balances">Edit balances</button></div></div>`)}<div class="f-duo">${block('Realized cashflow','Transactions recorded',`<div class="f-ledger-totals"><div>Cash earned/received <b style="color:var(--g)">${fmt(t.actualIncome)}</b></div><div>Spending logged <b style="color:var(--a)">${fmt(t.expenses)}</b></div><div>Net logged flow <b>${fmt(t.actualIncome-t.expenses)}</b></div></div><button class="btn" data-f="record">Record income or expense</button>`)}${block('Forecast is not cash','Potential weekly base',`<div class="f-large">${fmt(t.weekly)}<small> per week</small></div><p class="f-copy">The base uses editable Uber and Claimet weekly goals, not verified payouts. MIT claims are tracked separately by confirmed status.</p><button class="btn" data-v="revenue">Inspect revenue lanes →</button>`)}</div>`}
function revenue(){let t=totals();return `<div class="f-intro"><div><div class="eye">REVENUE ENGINE</div><h2>Multiple lanes.<br><em>Verified money.</em></h2><p>Set targets, record payouts, and track what is actually billable. Don't conflate projected contracts with cash.</p></div><button id="fNewEntry" class="btn primary">+ Record payout</button></div>${block('MIT missing reports','Pay per completed, accepted claim',`<div class="f-mit"><div class="f-mit-metric"><span>Selected</span><strong>${F.mit.selected}</strong></div><div class="f-mit-metric"><span>Completed</span><strong>${F.mit.completed}</strong></div><div class="f-mit-metric"><span>Paid</span><strong>${F.mit.paid}</strong></div><div class="f-mit-metric"><span>Earned, not yet paid *</span><strong>${fmt(Math.max(0,F.mit.completed-F.mit.paid)*10)}</strong></div></div><p class="f-copy">* Assumes Joe accepts each completed report at $10. The possible additional $10 is excluded until its condition is confirmed. Selecting a claim does not earn money.</p><div class="f-actions"><button class="btn" data-f="mit">Update MIT counts</button><button class="btn" data-f="joe">Joe backlog task</button></div>`)}${block('Income channels','Targets are manually maintained',`<div class="f-lanes">${F.lanes.map(l=>`<div class="f-lane"><span class="f-dot" style="background:${l.color}"></span><div><strong>${safe(l.name)}</strong><small>${safe(l.unit)} · ${l.verified?'rate confirmed':'target/unconfirmed'}</small></div><b>${fmt(l.forecast)}</b><button class="f-mini" data-editlane="${l.id}">Edit</button></div>`).join('')}</div>`)}${block('Recorded earnings','Actual entries only',ledger('income'))}`}
function ledger(kind){let list=F.entries.filter(e=>!kind||e.kind===kind).slice().sort((a,b)=>b.date.localeCompare(a.date));return list.length?`<div class="f-transactions">${list.slice(0,30).map(e=>`<div class="f-transaction"><div><b>${safe(e.source)}</b><small>${safe(e.date)} · ${safe(e.note||e.kind)}</small></div><strong style="color:${e.kind==='income'?'var(--g)':'var(--a)'}">${e.kind==='income'?'+':'−'}${fmt(e.amount)}</strong><button class="f-mini" data-delentry="${safe(e.id)}">×</button></div>`).join('')}</div>`:'<div class="empty">No transactions recorded. Historical spending and income have not been invented.</div>'}
function finance(){return `<div class="f-intro"><div><div class="eye">DEBT & RESERVES</div><h2>Repair the balance sheet.<br><em>Then scale.</em></h2><p>Reserve rent first. Model credit utilization once you enter card limits. The bike payoff quote is time-sensitive and must be reconfirmed.</p></div><button class="btn primary" data-f="balances">Edit balances</button></div>${block('Accounts','Manually entered balances',F.accounts.map(a=>`<div class="f-ledger-totals"><div>${safe(a.name)}<b>${fmt(a.balance)}</b></div></div>`).join(''))}${block('Debt schedule','Actual terms missing until entered',`<div class="f-debts">${F.debts.map(d=>`<div class="f-debt"><div><strong>${safe(d.name)}</strong><small>${d.limit?`Limit ${fmt(d.limit)} · utilization ${Math.round(100*d.balance/d.limit)}%`:'Credit limit unknown'}${d.due?' · next '+safe(d.due):''}</small></div><b>${fmt(d.balance)}</b><button class="f-mini" data-debt="${safe(d.id)}">Edit</button></div>`).join('')}</div><p class="f-copy">Utilization, interest and exact minimum payments require statement figures. Paying a lease early is not automatically optimal if it leaves rent uncovered.</p>`)}${block('Expense ledger','Track the leak',`<button class="btn" id="fNewEntry">+ Log expense</button>${ledger('expense')}`)}`}
const stages=['lead','contacted','applied','interview','offer','active','won','lost'];
function pipeline(){return `<div class="f-intro"><div><div class="eye">OUTBOUND ENGINE</div><h2>Attention → conversation<br><em>→ contract.</em></h2><p>Track work across employment, Upwork, MIT, services, agency, clothing and referrals. Move the opportunity only when the real world changes.</p></div><button class="btn primary" data-f="opportunity">+ Opportunity</button></div><div class="f-pipeline">${F.opportunities.map(o=>`<article class="f-opp"><div class="eye">${safe(o.type)}</div><div class="f-opp-row"><strong>${safe(o.name)}</strong><select data-stage="${safe(o.id)}">${stages.map(s=>`<option ${o.stage===s?'selected':''} value="${s}">${s.toUpperCase()}</option>`).join('')}</select></div><p>${safe(o.next||'No next action recorded')}</p><div class="f-opp-row"><small>${o.due?'Next '+safe(o.due):'No deadline confirmed'} · Value ${fmt(o.value)}</small><button class="f-mini" data-editopp="${safe(o.id)}">Edit</button></div></article>`).join('')}</div>${block('Opportunity discipline','Weekly activity',`<p class="f-copy">Engineering: prioritize recruiter callbacks and high-fit contract roles. Upwork: cap speculative spending until response economics are measured. Dog training, computer repair, moving and agency work: track outreach, booked calls, work delivered and collected payments separately.</p>`)}`}
function openForm(title,fields,submit){const host=document.createElement('dialog');host.className='f-dialog';host.innerHTML=`<form class="f-modal"><header><div class="eye">WITHERS · EDIT RECORD</div><h2>${safe(title)}</h2><button type="button" class="f-mini f-close">×</button></header>${fields.map(f=>`<label>${safe(f.label)}${f.type==='select'?`<select name="${f.key}">${f.options.map(x=>`<option value="${safe(x)}" ${f.value===x?'selected':''}>${safe(x)}</option>`).join('')}</select>`:`<input name="${f.key}" type="${f.type||'text'}" ${f.type==='number'?'min="0" step="any"':''} value="${safe(f.value??'')}" ${f.required?'required':''}>`}</label>`).join('')}<button type="submit" class="btn primary">Save record</button></form>`;document.body.append(host);host.showModal();host.querySelector('.f-close').onclick=()=>host.close();host.addEventListener('close',()=>host.remove());host.querySelector('form').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{submit(data);host.close();persist();draw()}catch(error){alert(error.message)}}}
function actions(){document.querySelectorAll('#fNewEntry,[data-f="record"]').forEach(b=>b.onclick=()=>openForm('Record a transaction',[{key:'kind',label:'Type',type:'select',value:b.id==='fNewEntry'&&S.view==='revenue'?'income':'expense',options:['income','expense']},{key:'source',label:'Source or merchant',required:true},{key:'amount',label:'Amount USD',type:'number',required:true},{key:'date',label:'Date',type:'date',value:date(),required:true},{key:'note',label:'Context'}],x=>{if(!x.source.trim()||num(x.amount)<=0)throw Error('A real source and positive amount are required.');F.entries.push({id:crypto.randomUUID(),...x,amount:num(x.amount)});if(x.kind==='income'&&x.source.toLowerCase().includes('mit')){ /* user reconciles MIT counts separately */}}));
 document.querySelectorAll('[data-delentry]').forEach(b=>b.onclick=()=>{if(confirm('Remove recorded entry?')){F.entries=F.entries.filter(x=>x.id!==b.dataset.delentry);persist();draw()}});
 document.querySelectorAll('[data-f="reserve"]').forEach(b=>b.onclick=()=>openForm('Move into rent reserve',[{key:'amount',label:'New reserved total USD',type:'number',value:F.rent.reserved,required:true},{key:'goal',label:'Monthly rent target USD',type:'number',value:F.rent.goal,required:true},{key:'months',label:'Months to protect',type:'number',value:F.rent.monthsTarget,required:true}],x=>{if(num(x.amount)>totals().liquid)throw Error('Reserved amount cannot exceed liquid balances.');F.rent.reserved=num(x.amount);F.rent.goal=num(x.goal);F.rent.monthsTarget=Math.max(1,num(x.months))}));
 document.querySelectorAll('[data-f="balances"]').forEach(b=>b.onclick=()=>openForm('Update cash and accounts',[...F.accounts.map(a=>({key:a.id,label:a.name+' balance',type:'number',value:a.balance,required:true})),{key:'reserved',label:'Rent reserved',type:'number',value:F.rent.reserved,required:true}],x=>{F.accounts.forEach(a=>a.balance=num(x[a.id]));if(num(x.reserved)>totals().liquid)throw Error('Rent reserve exceeds liquid cash.');F.rent.reserved=num(x.reserved)}));
 document.querySelectorAll('[data-f="mit"]').forEach(b=>b.onclick=()=>openForm('MIT report accounting',[{key:'selected',label:'Claims selected',type:'number',value:F.mit.selected},{key:'completed',label:'Claims completed and submitted',type:'number',value:F.mit.completed},{key:'paid',label:'Reports paid for',type:'number',value:F.mit.paid}],x=>{let s=num(x.selected),c=num(x.completed),p=num(x.paid);if(c>s||p>c)throw Error('Paid ≤ completed ≤ selected must hold.');Object.assign(F.mit,{selected:s,completed:c,paid:p})}));
 document.querySelectorAll('[data-f="joe"]').forEach(b=>b.onclick=()=>{S.view='board';save();render()});
 document.querySelectorAll('[data-editlane]').forEach(b=>b.onclick=()=>{let l=F.lanes.find(x=>x.id===b.dataset.editlane);openForm('Revenue lane — '+l.name,[{key:'forecast',label:'Target/rate USD',type:'number',value:l.forecast},{key:'unit',label:'Unit',type:'select',value:l.unit,options:['weekly','per claim','per session','per hour','project','job','session','sale','gig']}],x=>{l.forecast=num(x.forecast);l.unit=x.unit})});
 document.querySelectorAll('[data-debt]').forEach(b=>b.onclick=()=>{let d=F.debts.find(x=>x.id===b.dataset.debt);openForm('Debt — '+d.name,[{key:'balance',label:'Current balance',type:'number',value:d.balance},{key:'limit',label:'Credit limit (0 unknown)',type:'number',value:d.limit},{key:'apr',label:'APR % (0 unknown)',type:'number',value:d.apr},{key:'min',label:'Minimum payment',type:'number',value:d.min},{key:'due',label:'Next due date',type:'date',value:d.due}],x=>Object.assign(d,{balance:num(x.balance),limit:num(x.limit),apr:num(x.apr),min:num(x.min),due:x.due}))});
 document.querySelectorAll('[data-f="opportunity"]').forEach(b=>b.onclick=()=>editOpp());document.querySelectorAll('[data-editopp]').forEach(b=>b.onclick=()=>editOpp(F.opportunities.find(x=>x.id===b.dataset.editopp)));document.querySelectorAll('[data-stage]').forEach(s=>s.onchange=()=>{let o=F.opportunities.find(x=>x.id===s.dataset.stage);if(o){o.stage=s.value;persist();draw()}});
 document.querySelectorAll('[data-v="revenue"]').forEach(b=>b.onclick=()=>{S.view='revenue';save();render()});
}
function editOpp(o){openForm(o?'Edit opportunity':'New opportunity',[{key:'name',label:'Opportunity',value:o?.name||'',required:true},{key:'type',label:'Lane',value:o?.type||'Engineering',type:'select',options:['Engineering','Career','MIT','Service','Creative','Training','Other']},{key:'stage',label:'Stage',value:o?.stage||'lead',type:'select',options:stages},{key:'value',label:'Potential contract value (not revenue)',type:'number',value:o?.value||0},{key:'next',label:'Next physical action',value:o?.next||''},{key:'due',label:'Next action date',type:'date',value:o?.due||''}],x=>{if(!x.name.trim())throw Error('Name required');let val={id:o?.id||crypto.randomUUID(),...x,value:num(x.value)};if(o)Object.assign(o,val);else F.opportunities.push(val)})}
function draw(){const body=({capital:overview,revenue,finance,pipeline})[S.view];if(!body)return;$('#title').textContent=({capital:'Capital',revenue:'Revenue',finance:'Debt',pipeline:'Pipeline'})[S.view];$('#app').innerHTML=body();actions()}
V.splice(3,0,['capital','Capital'],['revenue','Revenue'],['finance','Debt'],['pipeline','Pipeline']);
const oldRender=render;render=function(){if(['capital','revenue','finance','pipeline'].includes(S.view)){nav();draw();return}oldRender()};
const oldMoney=money;money=function(){return overview()};
const oldBind=bind;bind=function(){oldBind();if(S.view==='money')actions()};
// Initial state is a financial snapshot, not a bank feed. Never overwrite existing older values without explicit user updates.
render();
})();
