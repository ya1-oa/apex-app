<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090c"><title>WITHERS — Command</title><style>
:root{--b:#08090c;--s:#12151b;--s2:#181c23;--l:#2a2f39;--t:#f5f4ef;--m:#9299a6;--g:#d6ff4b;--c:#9fdcff;--a:#f0ba66;--v:#bca7ff;--r:18px}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.01em}button,input,select,textarea{font:inherit}button{cursor:pointer}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.rail{position:fixed;inset:0 auto 0 0;width:84px;border-right:1px solid var(--l);background:#090a0eea;display:flex;flex-direction:column;align-items:center;padding:18px 10px;z-index:5}.mark{width:44px;height:44px;display:grid;place-items:center;border:1px solid #3a404b;clip-path:polygon(0 0,100% 0,100% 74%,74% 100%,0 100%);font-weight:900}.nav{margin:auto 0;display:grid;gap:8px}.nav button,.ico{width:50px;height:50px;border:0;border-radius:15px;background:none;color:#636b78;display:grid;place-items:center}.nav button.on{color:var(--g);background:#d6ff4b12;border:1px solid #d6ff4b28}.avatar{width:42px;height:42px;border:1px solid #3a404b;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800}.shell{margin-left:84px}.top{height:88px;position:sticky;top:0;z-index:4;background:#08090cdd;backdrop-filter:blur(18px);border-bottom:1px solid var(--l);padding:18px 28px;display:flex;align-items:center;justify-content:space-between}.eye{font:700 10px ui-monospace,monospace;color:var(--m);letter-spacing:.15em;text-transform:uppercase}.top h1{margin:4px 0 0;font-size:28px;letter-spacing:-.045em}.actions{display:flex;gap:8px}.btn{height:42px;border-radius:13px;border:1px solid var(--l);padding:0 15px;background:var(--s);color:var(--t);font-weight:750}.btn.primary{background:var(--g);color:#0b0d0f;border-color:var(--g)}main{padding:28px;max-width:1500px;margin:auto}.hero{display:grid;grid-template-columns:1.5fr .7fr;gap:16px;margin-bottom:18px}.heroA{min-height:250px;border-top:1px solid #424853;border-bottom:1px solid var(--l);padding:26px 0;display:flex;flex-direction:column;justify-content:space-between;position:relative}.heroA:before{content:"";position:absolute;top:-1px;left:0;width:92px;height:2px;background:var(--g)}.heroA h2{font-size:clamp(36px,5vw,70px);line-height:.94;letter-spacing:-.065em;margin:15px 0}.heroA p{margin:0;color:var(--m);max-width:690px;line-height:1.55;font-size:13px}.heroB,.panel{border:1px solid var(--l);background:linear-gradient(150deg,#ffffff08,#ffffff02);border-radius:var(--r);padding:18px}.heroB{display:flex;flex-direction:column;justify-content:space-between}.big{font:800 46px ui-monospace,monospace;letter-spacing:-.07em}.bar{height:6px;background:#090b0f;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),#9cffc8)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--l);margin-bottom:18px}.metric{padding:14px;border-right:1px solid var(--l)}.metric:last-child{border:0}.metric b{display:block;font:750 22px ui-monospace,monospace}.metric span{font-size:9px;color:var(--m);text-transform:uppercase;letter-spacing:.11em}.grid{display:grid;grid-template-columns:7fr 5fr;gap:14px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.head h3{margin:3px 0 0;font-size:18px}.head p{margin:0;color:var(--m);font-size:11px}.queue{display:grid;gap:8px}.task{display:grid;grid-template-columns:25px 1fr auto;gap:11px;align-items:start;border:1px solid var(--l);border-radius:14px;padding:11px;background:#ffffff03}.task.done{opacity:.42}.check{width:23px;height:23px;border:1px solid #444b58;border-radius:7px;background:none;color:#08100c}.task.done .check{background:#9cffc8;border-color:#9cffc8}.tt{font-weight:720;font-size:13px}.tm{margin-top:5px;color:var(--m);font-size:9px;text-transform:uppercase;letter-spacing:.08em;display:flex;gap:7px;flex-wrap:wrap}.p{font:700 9px ui-monospace,monospace;border:1px solid var(--l);border-radius:20px;padding:4px 7px}.p1{color:#ff7474}.p2{color:var(--a)}.domains{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.domain{min-height:118px;padding:13px;border:1px solid var(--l);border-radius:15px;background:#ffffff03;display:flex;flex-direction:column;justify-content:space-between}.dt{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:750}.lv{font:700 9px ui-monospace,monospace;color:var(--m)}.score{font-size:26px;font-weight:800}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lane{min-height:430px;padding:11px;border:1px solid var(--l);border-radius:17px;background:#ffffff02}.lane.over{border-color:#d6ff4b66}.laneHead{display:flex;justify-content:space-between;padding:4px 3px 12px;font:800 10px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}.card{border:1px solid var(--l);background:var(--s);border-radius:13px;padding:12px;margin-bottom:8px;cursor:grab}.card b{font-size:12px}.card small{display:flex;justify-content:space-between;margin-top:8px;color:var(--m);font:700 9px ui-monospace,monospace}.money{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--l);border-radius:17px;overflow:hidden}.money div{padding:17px;border-right:1px solid var(--l)}.money div:last-child{border:0}.money b{display:block;font:800 23px ui-monospace,monospace}.money span{font-size:9px;color:var(--m);text-transform:uppercase;letter-spacing:.1em}.master{display:grid;gap:0}.mi{display:grid;grid-template-columns:170px 1fr 50px;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--l)}.mi:last-child{border:0}.mi b{font-size:12px}.mi small{text-align:right;color:var(--m);font:700 9px ui-monospace,monospace}.empty{padding:28px;text-align:center;color:var(--m);border:1px dashed var(--l);border-radius:14px}dialog{border:0;background:transparent;color:var(--t);width:min(720px,calc(100vw - 24px))}dialog::backdrop{background:#000b;backdrop-filter:blur(7px)}.modal{background:#0e1116;border:1px solid #3d4450;border-radius:23px;padding:19px}.mh{display:flex;justify-content:space-between}.mh h2{margin:4px 0 16px}.x{width:40px;height:40px;border:1px solid var(--l);border-radius:12px;background:var(--s);color:var(--m)}.modal input,.modal select,.modal textarea{width:100%;min-height:46px;background:var(--s2);color:var(--t);border:1px solid var(--l);border-radius:12px;padding:11px;margin-top:7px}.fg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:9px 0}.fg label{font-size:9px;color:var(--m);text-transform:uppercase;letter-spacing:.1em}.ma{display:flex;justify-content:flex-end;margin-top:10px}.coachBlock{padding:13px 0;border-bottom:1px solid var(--l)}.coachBlock p{color:var(--m);font-size:12px;line-height:1.6}.mobile{display:none}.compact main{padding:18px}.compact .panel{padding:14px}@media(max-width:900px){.hero,.grid{grid-template-columns:1fr}.domains{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:1fr}.lane{min-height:0}}@media(max-width:680px){.rail{display:none}.shell{margin:0}.top{height:76px;padding:13px 15px}.actions .btn:first-child{display:none}main{padding:16px 15px 92px}.mobile{display:grid;position:fixed;left:9px;right:9px;bottom:calc(9px + env(safe-area-inset-bottom));grid-template-columns:repeat(5,1fr);padding:5px;background:#10131aea;border:1px solid var(--l);backdrop-filter:blur(18px);border-radius:20px;z-index:8}.mobile button{width:auto}.heroA{min-height:220px}.heroA h2{font-size:40px}.metrics{grid-template-columns:1fr 1fr}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--l)}.domains{grid-template-columns:1fr}.money{grid-template-columns:1fr}.money div{border-right:0;border-bottom:1px solid var(--l)}.mi{grid-template-columns:1fr 45px}.mi .bar{grid-column:1/-1;grid-row:2}.fg{grid-template-columns:1fr}}
</style></head><body><aside class="rail"><div class="mark">W</div><nav class="nav" id="nav"></nav><button class="ico" id="density">≡</button><div class="avatar">YY</div></aside><div class="shell"><header class="top"><div><div class="eye" id="date"></div><h1 id="title">Command</h1></div><div class="actions"><button class="btn" id="focus">Focus</button><button class="btn primary" id="capture">+ Capture</button></div></header><main id="app"></main></div><nav class="mobile nav" id="mobile"></nav><dialog id="dlg"><form class="modal" id="form"><div class="mh"><div><div class="eye">CAPTURE → ROUTE → EXECUTE</div><h2>What needs to happen?</h2></div><button type="button" class="x" id="close">×</button></div><input id="task" required placeholder="e.g. Finish MIT claim selector"><div class="fg"><label>Domain<select id="domain"></select></label><label>Priority<select id="pri"><option value="1">Critical</option><option value="2" selected>High</option><option value="3">Normal</option><option value="4">Low</option></select></label><label>Minutes<input id="mins" type="number" value="30" min="5" step="5"></label></div><textarea id="note" rows="3" placeholder="Definition of done / evidence"></textarea><div class="ma"><button class="btn primary">Add to queue</button></div></form></dialog><dialog id="coach"><form method="dialog" class="modal"><div class="mh"><div><div class="eye">COACH</div><h2>Think better. Ship more.</h2></div><button class="x">×</button></div><div id="coachbody"></div></form></dialog><script>
const K='withers.v1',V=[['command','Command'],['board','Board'],['domains','Domains'],['money','Money'],['mastery','Mastery']],D=[['career','Engineering',72,'#9fdcff'],['income','Income',58,'#d6ff4b'],['body','Body',31,'#9cffc8'],['creative','Creative',42,'#bca7ff'],['music','Music',14,'#f0ba66'],['games','Games',37,'#ff8b8b'],['school','School',46,'#80f2d0'],['business','Business',39,'#ffd36b'],['life','Life',44,'#a7c7ff']];let S=load();function uid(){return crypto.randomUUID()}function seed(){return{view:'command',tasks:[['Build MIT claim listing + selector','income',1,90,'now','Joe can choose claims that need MIT work.'],['Finish FAFSA documentation','school',1,60,'now','Submission-ready packet.'],['Prepare Tuesday contract interviews','career',1,60,'now','Python/OOP/integrations + AI stories.'],['Repair missing bike pedal','life',1,45,'now','Income equipment operational.'],['Clothing prototype drawings for Viv','creative',2,90,'next','Two sendable concepts.'],['Dog training offer + Nextdoor pipeline','business',2,60,'next','Offer + weekly lead target.'],['Violin practice — fundamentals + one piece','music',3,45,'next','Recorded evidence.'],['Hall / Wilted founder session','games',3,120,'incubate','One artifact, not more ideation.']].map(x=>({id:uid(),title:x[0],domain:x[1],priority:x[2],minutes:x[3],status:x[4],note:x[5],done:false})),domains:D.map(x=>({id:x[0],name:x[1],score:x[2],color:x[3]})),money:{cash:730,rentGoal:1234,rentSaved:400,cards:2401,target:20000},master:[['Software engineering',56],['Systems / security',34],['Art / design',39],['Animation / 3D',16],['Game design',32],['Music / violin',18],['Business / sales',29],['Writing / research',37]]}}function load(){try{return{...seed(),...JSON.parse(localStorage.getItem(K)||'{}')}}catch{return seed()}}function save(){localStorage.setItem(K,JSON.stringify(S))}function esc(x=''){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function $ (q){return document.querySelector(q)}function dom(id){return S.domains.find(x=>x.id===id)||{name:id,color:'#fff'}}function cash(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n)}function nav(){let h=V.map(([i,n])=>`<button class="${S.view===i?'on':''}" data-v="${i}" title="${n}">${({command:'⌂',board:'▦',domains:'◇',money:'$',mastery:'✦'})[i]}</button>`).join('');$('#nav').innerHTML=h;$('#mobile').innerHTML=h;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;save();render()})}function domainCard(d){return`<div class="domain" style="--x:${d.color}"><div class="dt"><span>${d.name}</span><span class="lv">LV ${Math.max(1,Math.floor(d.score/10))}</span></div><div><div class="score">${d.score}</div><div class="bar"><i style="width:${d.score}%;background:${d.color}"></i></div></div></div>`}function taskCard(t){let d=dom(t.domain);return`<div class="task ${t.done?'done':''}"><button class="check" data-c="${t.id}">${t.done?'✓':''}</button><div><div class="tt">${esc(t.title)}</div><div class="tm"><span style="color:${d.color}">${d.name}</span><span>${t.minutes}m</span><span>${esc(t.note)}</span></div></div><span class="p p${t.priority}">P${t.priority}</span></div>`}function command(){let a=S.tasks.filter(t=>t.status==='now'&&!t.done),crit=a.filter(t=>t.priority===1).length,r=Math.round(S.money.rentSaved/S.money.rentGoal*100);return`<section class="hero"><div class="heroA"><div><div class="eye" style="color:var(--g)">CURRENT OPERATING WINDOW</div><h2>${crit?`${crit} critical move${crit>1?'s':''}. Finish before expanding.`:'Clear field. Choose the next meaningful move.'}</h2></div><p>This is not a to-do dump. It surfaces work that protects cash, creates leverage, or advances a craft.</p></div><div class="heroB"><div><div class="eye">30-DAY TARGET</div><div class="big">${cash(S.money.target)}</div></div><div><div class="eye">RENT PROTECTED · ${r}%</div><div class="bar" style="margin-top:8px"><i style="width:${r}%"></i></div></div></div></section><section class="metrics"><div class="metric"><b>${a.length}</b><span>Active tasks</span></div><div class="metric"><b>${cash(S.money.cash)}</b><span>Liquid snapshot</span></div><div class="metric"><b>${cash(S.money.rentGoal-S.money.rentSaved)}</b><span>Rent gap</span></div><div class="metric"><b>${cash(S.money.cards)}</b><span>Cards to clear</span></div></section><div class="grid"><section class="panel"><div class="head"><div><div class="eye">EXECUTE</div><h3>Command queue</h3></div><p>Now means now.</p></div><div class="queue">${a.length?a.slice(0,6).map(taskCard).join(''):'<div class="empty">Nothing in NOW.</div>'}</div></section><section class="panel"><div class="head"><div><div class="eye">SIGNALS</div><h3>Domain pressure</h3></div><button class="btn" id="coachBtn">Coach</button></div><div class="domains">${S.domains.slice(0,6).map(domainCard).join('')}</div></section></div>`}function board(){return`<div class="head"><div><div class="eye">PRIORITY GRAPH</div><h3>Move work by consequence</h3></div><p>Drag cards. Keep NOW small.</p></div><section class="board">${[['now','NOW'],['next','NEXT'],['incubate','INCUBATE']].map(([id,n])=>`<div class="lane" data-l="${id}"><div class="laneHead"><span>${n}</span><span>${S.tasks.filter(t=>t.status===id&&!t.done).length}</span></div>${S.tasks.filter(t=>t.status===id&&!t.done).map(t=>`<div class="card" draggable="true" data-id="${t.id}"><b>${esc(t.title)}</b><small><span style="color:${dom(t.domain).color}">${dom(t.domain).name}</span><span>${t.minutes}m · P${t.priority}</span></small></div>`).join('')}</div>`).join('')}</section>`}function domains(){return`<div class="head"><div><div class="eye">LIFE MAP</div><h3>Everything visible. Few things active.</h3></div></div><section class="domains">${S.domains.map(domainCard).join('')}</section>`}function money(){let m=S.money;return`<div class="head"><div><div class="eye">CAPITAL CONTROL</div><h3>Protect runway before aesthetics.</h3></div></div><section class="money"><div><b style="color:#9cffc8">${cash(m.cash)}</b><span>Liquid</span></div><div><b>${cash(m.rentSaved)}</b><span>Rent protected</span></div><div><b style="color:var(--a)">${cash(m.rentGoal-m.rentSaved)}</b><span>Rent gap</span></div><div><b style="color:var(--a)">${cash(m.cards)}</b><span>Cards</span></div></section><section class="panel" style="margin-top:14px"><div class="head"><div><div class="eye">ORDER OF MONEY</div><h3>Capital hierarchy</h3></div></div><div class="master">${['Rent reserve','Income-producing bike repair','Food + transport basics','Credit stabilization','Career leverage / RAM','Prototype spending','Room + bike upgrades'].map((x,i)=>`<div class="mi"><b>${i+1}. ${x}</b><div class="bar"><i style="width:${100-i*12}%"></i></div><small>TIER ${i+1}</small></div>`).join('')}</div></section>`}function mastery(){return`<div class="head"><div><div class="eye">MASTERY ENGINE</div><h3>Practice produces evidence.</h3></div><p>AI cannot award mastery for generated output.</p></div><section class="panel master">${S.master.map(([n,p])=>`<div class="mi"><b>${n}</b><div class="bar"><i style="width:${p}%;background:linear-gradient(90deg,var(--v),var(--c))"></i></div><small>${p}%</small></div>`).join('')}</section>`}function bind(){document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{let t=S.tasks.find(x=>x.id===b.dataset.c);t.done=!t.done;if(t.done){let d=dom(t.domain);d.score=Math.min(100,d.score+2)}save();render()});document.querySelectorAll('.card').forEach(c=>c.ondragstart=e=>e.dataTransfer.setData('text/plain',c.dataset.id));document.querySelectorAll('.lane').forEach(l=>{l.ondragover=e=>{e.preventDefault();l.classList.add('over')};l.ondragleave=()=>l.classList.remove('over');l.ondrop=e=>{e.preventDefault();let t=S.tasks.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(t)t.status=l.dataset.l;save();render()}});let c=$('#coachBtn');if(c)c.onclick=coach}function render(){$('#date').textContent=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'short',day:'2-digit'}).format(new Date()).toUpperCase();$('#title').textContent=(V.find(x=>x[0]===S.view)||V[0])[1];nav();$('#app').innerHTML=({command,board,domains,money,mastery})[S.view]();bind()}function coach(){let t=S.tasks.filter(x=>x.status==='now'&&!x.done).sort((a,b)=>a.priority-b.priority)[0];$('#coachbody').innerHTML=`<div class="coachBlock"><b>What matters next</b><p>${t?`Finish “${esc(t.title)}” before opening another lane. State what evidence proves it is done.`:'Pull one task that protects cash or creates leverage.'}</p></div><div class="coachBlock"><b>Critical-thinking rule</b><p>Write your own hypothesis or solution first. Use AI to challenge it, test it, or expose gaps—not to replace the thinking.</p></div><div class="coachBlock"><b>Phase 4</b><p>This becomes the ShuShu-style mastery coach: drills, critique, spaced practice, and advancement based on evidence.</p></div>`;$('#coach').showModal()}$('#capture').onclick=()=>{$('#domain').innerHTML=S.domains.map(d=>`<option value="${d.id}">${d.name}</option>`).join('');$('#dlg').showModal();setTimeout(()=>$('#task').focus(),50)};$('#close').onclick=()=>$('#dlg').close();$('#form').onsubmit=e=>{e.preventDefault();S.tasks.unshift({id:uid(),title:$('#task').value.trim(),domain:$('#domain').value,priority:+$('#pri').value,minutes:+$('#mins').value||30,status:'now',note:$('#note').value.trim(),done:false});save();e.target.reset();$('#dlg').close();render()};$('#focus').onclick=()=>document.body.classList.toggle('compact');$('#density').onclick=()=>document.body.classList.toggle('compact');document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k')$('#capture').click()});render();
</script></body></html>
